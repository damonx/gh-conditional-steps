name: Matrix Demo
on: push
jobs:
    build:
        continue-on-error: true
        strategy:
            matrix:
                node-version: [14, 16, 18]
                os: [ubuntu-latest, windows-latest, macos-latest]
                include:
                    - node-version: 18
                      os: ubuntu-latest
                exclude:
                    - node-version: 12
                      os: windows-latest
                    - node-version: 14
                      os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: ${{ matrix.node-version }}
            - name: Install dependencies
              run: npm ci
            - name: Build project
              run: npm run build